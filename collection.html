<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Sticker album tracker</title>
	<link rel="icon" href="icon.png">
	<meta content="width=device-width,initial-scale=1" name="viewport">
	<link rel="stylesheet" href="main.css?v2">
</head>
<body>
	<h1>Sticker album tracker<span id="total-total"></span></h1>
	<script>
	const id = localStorage.getItem('login');
	if (!id) { location.href = 'index.html'; }
	</script>
	<button id="show-missing">Just show missing (printable)</button>
	<button id="show-dupes">Just show duplicates (printable)</button>
	<label style="margin-left: 0.5em;">Sort by <select id="sort-by"><option value="album">album order</option><option value="alphabetical">alphabetical order</option></select></label>
	<form id="logout-form"><input type="submit" value="❌ Log out"></form><br>
	<search style="margin:6px;">
		<label>🔍 Search <input type="text" autocomplete="off" id="search-input"></label>
	</search>
	<template id="sticker-template"><div class="sticker"><b
			class="sticker-name"></b>: <span class="sticker-status"></span><br>
			<button class="add">+</button>
			<button class="sub">−</button
		></div
	></template>
	<p id="loading">Loading...</p>
	<p id="error" class="error floating-error"></p>
	<div id="main"></div>
	<script src="collection.js?v3" type="module"></script>
</body>
